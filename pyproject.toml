[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlec"
version = "0.1.0"
description = "Open-source Agentic AI Infrastructure for Low-Power LEC and UPF Verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenLEC Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1"
]

[project.scripts]
openlec = "openlec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openlec*"]
