[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlec"
version = "1.0.0"
description = "Production-Grade Agentic AI Infrastructure for Low-Power LEC and UPF Verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "networkx>=3.2.0"
]

[project.scripts]
openlec = "openlec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openlec*"]

[tool.ruff]
line-length = 100
target-version = "py310"
